name: release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v0.1.0)'
        required: true
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      # CLI: self-contained tarball (bundled Node + app).
      - run: npm run release:linux
      # Desktop: self-contained Electron AppImage.
      - run: npm run desktop:setup
      - run: npm --prefix desktop run app:build:linux
      # One release carrying both the CLI tarball (+checksum) and the AppImage.
      - run: gh release create "$TAG" dist/gantry-linux-x64.tar.gz dist/gantry-linux-x64.tar.gz.sha256 desktop/dist/*.AppImage --target "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
