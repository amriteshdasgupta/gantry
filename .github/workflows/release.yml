name: release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to create (e.g. v0.1.0)'
        required: true
permissions:
  contents: write
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      # Builds packages/ui/dist, which the desktop bundle stages into the app.
      - run: npm run build
      - run: npm run desktop:setup
      - run: npm --prefix desktop run app:build:linux
      - run: gh release create "$TAG" desktop/dist/*.AppImage --target "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
